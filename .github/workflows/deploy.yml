# Deploy via Cloudflare Tunnel + Access
name: deploy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Prepare environment variables
        run: |
          echo "${{ secrets.ENV_VARIABLES }}" | base64 -d > .env

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}

      - name: Compute outputs
        id: compute-outputs
        run: |
          echo "tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1 )" >> "$GITHUB_OUTPUT"
          echo "docker-compose=$(base64 docker-compose.yml | tr -d '\n')" >> "$GITHUB_OUTPUT"

    outputs:
      tag: ${{ steps.compute-outputs.outputs.tag }}
      docker-compose: ${{ steps.compute-outputs.outputs.docker-compose }}

  deploy:
    name: Deploy image
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Deploy using webhook through Cloudflare Tunnel + Access
      - name: Deploy docker container webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DOCKER_TAG: ${{ needs.build.outputs.tag }}
          DOCKER_COMPOSE: ${{ needs.build.outputs.docker-compose }}
          DOCKER_PROJECT: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_VARIABLES: ${{ secrets.ENV_VARIABLES }}
        run: |
          jq -n \
            --arg p "$GH_TOKEN" \
            --arg proj "$DOCKER_PROJECT" \
            --arg comp "$DOCKER_COMPOSE" \
            --arg tag "$DOCKER_TAG" \
            --arg env "$ENV_VARIABLES" \
            '{DOCKER_PASSWORD:$p,DOCKER_PROJECT:$proj,DOCKER_COMPOSE:$comp,DOCKER_TAG:$tag,ENV_VARIABLES:$env}' > body.json
          curl -f --retry 3 --retry-delay 5 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Token: $WEBHOOK_TOKEN" \
            -H "CF-Access-Client-Id: $CF_ID" \
            -H "CF-Access-Client-Secret: $CF_SECRET" \
            --data @body.json

      - name: Healthcheck new sha live
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 36); do
            LIVE_SHA=$(curl -fsS https://david.bertet.fr/api/health | jq -r .sha) && \
            [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && echo "live $LIVE_SHA" && exit 0
            echo "try $i: live=${LIVE_SHA:-unreachable} want=$EXPECTED_SHA"
            sleep 5
          done; echo "healthcheck failed"; exit 1
